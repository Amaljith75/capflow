[project]
name = "capflow-worker"
version = "0.1.0"
description = "Capflow background worker: reminder planning, dispatch, promise tracking and AI drafting"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "cryptography>=43",
  "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["capflow_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database with the Capflow migrations applied"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["S101", "ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's decorators are untyped; the task bodies themselves are fully typed.
module = ["capflow_worker.tasks"]
disallow_untyped_decorators = false
